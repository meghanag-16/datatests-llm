version: 2

# Model and column descriptions only. The paper's manual test sets are added in a later step.
models:
  - name: dim_teams
    description: Dimension table for football teams.
    columns:
      - name: team_id
        description: TheSportsDB team id.
      - name: team_name

  - name: fct_matches
    description: Fact table containing all finished football matches.
    columns:
      - name: match_id
        description: TheSportsDB event id.
      - name: league_id
      - name: season
      - name: match_date
      - name: match_status
      - name: home_team_id
      - name: home_team_name
      - name: home_team_score
      - name: away_team_id
      - name: away_team_name
      - name: away_team_score

  - name: fct_training_dataset
    description: Training dataset derived from curated football match data (a view on fct_matches).
    columns:
      - name: match_id
      - name: match_date
      - name: match_result
        description: HOME_WIN, AWAY_WIN or DRAW.
      - name: home_team_id
      - name: home_team_name
      - name: home_avg_goals_scored_last_5
      - name: home_avg_goals_conceded_last_5
      - name: away_team_id
      - name: away_team_name
      - name: away_avg_goals_scored_last_5
      - name: away_avg_goals_conceded_last_5
