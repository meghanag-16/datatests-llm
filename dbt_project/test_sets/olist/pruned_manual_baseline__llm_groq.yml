# Minimal test set chosen by scoring/run.py from: manual_baseline.yml, llm_groq.yml.
# Do not edit by hand.

version: 2
models:
- name: dim_customers
  columns:
  - name: customer_id
    data_tests:
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: customer_id
        config:
          meta:
            test_id: dim_customers.customer_id.relationships.19e7e5c0
            source: llm_groq
    - unique:
        config:
          meta:
            test_id: dim_customers.customer_id.unique.8f420d31
            source: manual_baseline
  - name: state
    data_tests:
    - accepted_values:
        arguments:
          values:
          - AC
          - AL
          - AP
          - AM
          - BA
          - CE
          - DF
          - ES
          - GO
          - MA
          - MT
          - MS
          - MG
          - PA
          - PB
          - PR
          - PE
          - PI
          - RJ
          - RN
          - RS
          - RO
          - RR
          - SC
          - SP
          - SE
          - TO
        config:
          meta:
            test_id: dim_customers.state.accepted_values.50c879d9
            source: llm_groq
    - not_null:
        config:
          meta:
            test_id: dim_customers.state.not_null.754a3016
            source: llm_groq
  - name: city
    data_tests:
    - not_null:
        config:
          meta:
            test_id: dim_customers.city.not_null.f7c41565
            source: llm_groq
  - name: customer_unique_id
    data_tests:
    - not_null:
        config:
          meta:
            test_id: dim_customers.customer_unique_id.not_null.66916611
            source: llm_groq
  - name: zip_code_prefix
    data_tests:
    - not_null:
        config:
          meta:
            test_id: dim_customers.zip_code_prefix.not_null.6b0c68e9
            source: llm_groq
- name: dim_products
  data_tests:
