- name: fct_orders
  data_tests:
  - expression_is_true:
      arguments:
        expression: CASE WHEN delivered_customer_at IS NOT NULL THEN delivery_days = DATEDIFF('day', purchased_at, delivered_customer_at)
          ELSE TRUE END
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.80ff2cc2
          source: llm_groq
  - expression_is_true:
      arguments:
        expression: estimated_delivery_date >= CAST(purchased_at AS DATE)
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.90bbdc32
          source: llm_groq
  - expression_is_true:
      arguments:
        expression: approved_at >= purchased_at
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.dc2005c7
          source: llm_groq
  columns:
