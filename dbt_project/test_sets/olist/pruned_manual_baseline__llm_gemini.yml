- name: fct_orders
  data_tests:
  - expression_is_true:
      arguments:
        expression: delivery_days IS NULL OR delivery_days = DATE_DIFF('day', purchased_at::DATE, delivered_customer_at::DATE)
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.293ad750
          source: llm_gemini
  - expression_is_true:
      arguments:
        expression: approved_at IS NULL OR approved_at >= purchased_at
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.40cb5944
          source: llm_gemini
  - expression_is_true:
      arguments:
        expression: estimated_delivery_date >= purchased_at::DATE
      config:
        meta:
          test_id: fct_orders._model.expression_is_true.ff2da4b1
          source: llm_gemini
