[project]
name = "data-eng"
version = "0.1.0"
description = "LLM-generated dbt tests, pruned by mutation testing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "duckdb>=1.0",
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",   # Gemini (official Google Gen AI SDK)
    "openai>=1.0",         # client for OpenAI-compatible endpoints (Groq, NVIDIA NIM, Ollama)
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "streamlit>=1.65.0",
]

[tool.uv]
# This is an application, not a library to publish, so uv does not build or install it as a package.
package = false

[tool.pytest.ini_options]
# Only look for tests in tests/ (airflow/logs holds Docker links Windows cannot open).
testpaths = ["tests"]
