# Light checks on every push and pull request. No API keys, no data downloads, no LLM calls.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project environment (from uv.lock)
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -q

      - name: dbt project parses (models and test sets)
        run: uv run dbt parse --project-dir dbt_project --profiles-dir dbt_project
        env:
          DUCKDB_PATH: ci.duckdb

      - name: Dashboard data script runs
        run: uv run python dashboard/export.py
